const a=document.getElementById('panel'),n=document.getElementById('notice'),b=document.getElementById('fallback');let at=+a.dataset.at,p,opening=false;
async function read(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),6500);try{const r=await fetch(url,{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',redirect:'error',signal:c.signal,headers:{Accept:'application/json'}});if(!r.ok||!/^application[/]json/i.test(r.headers.get('content-type')||''))throw 0;const reader=r.body.getReader(),parts=[],decoder=new TextDecoder();let size=0;while(true){const v=await reader.read();if(v.done)break;size+=v.value.length;if(size>2048){await reader.cancel();throw 0}parts.push(decoder.decode(v.value,{stream:true}))}parts.push(decoder.decode());return JSON.parse(parts.join(''))}finally{clearTimeout(t)}}
